<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 580" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="580" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="400" y="35" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">SSH Connection Flow with File Transfer and Semaphore</text>
  
  <!-- External Host -->
  <rect x="70" y="120" width="160" height="100" rx="10" fill="#b3e0ff" stroke="#0066cc" stroke-width="2" />
  <text x="150" y="155" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">External Host</text>
  <text x="150" y="180" font-family="Arial" font-size="14" text-anchor="middle">Client Application</text>
  
  <!-- Firewall -->
  <rect x="320" y="100" width="55" height="260" rx="5" fill="#ffcccc" stroke="#cc0000" stroke-width="2" />
  <text x="360" y="225" font-family="Arial" font-size="14" text-anchor="middle" transform="rotate(90 360 225)" font-weight="bold">Firewall</text>

   <!-- Firewall Rules-->
  <text x="345" y="225" font-family="Arial" font-size="12" text-anchor="middle" transform="rotate(90 345 225)">Allows Port 22 Only</text>
  <text x="330" y="225" font-family="Arial" font-size="12" text-anchor="middle" transform="rotate(90 330 225)">From Specific IP Ranges</text>
  
  <!-- Server -->
  <rect x="450" y="100" width="280" height="250" rx="10" fill="#d9f2d9" stroke="#006600" stroke-width="2" />
  <text x="590" y="125" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Dedicated Server</text>
  
  <!-- Landing Zone -->
  <rect x="470" y="150" width="240" height="180" rx="10" fill="#e6e6e6" stroke="#666666" stroke-width="2" />
  <text x="590" y="170" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Landing Zone</text>
  
  <!-- Storage Area -->
  <rect x="485" y="185" width="100" height="120" rx="5" fill="#fff2cc" stroke="#d6b656" stroke-width="2" />
  <text x="535" y="205" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">File Storage</text>
  <rect x="495" y="215" width="80" height="15" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <rect x="495" y="240" width="80" height="15" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <rect x="495" y="265" width="80" height="15" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1" />
  
  <!-- Semaphore Area -->
  <rect x="595" y="185" width="100" height="120" rx="5" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" />
  <text x="645" y="205" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Semaphore</text>
  <circle cx="645" cy="240" r="25" fill="#ff9999" stroke="#cc0000" stroke-width="2" />
  <text x="645" y="245" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Flag</text>
  
  <!-- Connection Lines -->
  <line x1="230" y1="170" x2="310" y2="170" stroke="#000000" stroke-width="2" />
  <polygon points="305,165 315,170 305,175" fill="#000000" />
  
  <line x1="374" y1="170" x2="440" y2="170" stroke="#000000" stroke-width="2" />
  <polygon points="435,165 445,170 435,175" fill="#000000" />
  
  <!-- SSH Label -->
  <rect x="235" y="140" width="70" height="25" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <text x="270" y="157" font-family="Arial" font-size="12" text-anchor="middle">SSH (22)</text>
  
  <!-- IP Range Labels -->
  <rect x="105" y="70" width="150" height="35" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <text x="180" y="85" font-family="Arial" font-size="12" text-anchor="middle">Allowed IPv4 Range:</text>
  <text x="180" y="100" font-family="Arial" font-size="12" text-anchor="middle">192.168.1.0/24</text>
  
  <rect x="105" y="240" width="150" height="35" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <text x="180" y="255" font-family="Arial" font-size="12" text-anchor="middle">Allowed IPv6 Range:</text>
  <text x="180" y="270" font-family="Arial" font-size="12" text-anchor="middle">2001:db8::/64</text>
  
  <!-- Process Flow -->
  <path d="M 535 320 Q 535 350 590 350 Q 645 350 645 310" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" />
  <polygon points="640,315 645,305 650,315" fill="#000000" />
  <text x="590" y="365" font-family="Arial" font-size="13" text-anchor="middle">File presence triggers semaphore</text>
  
  <!-- Return Flow -->
  <path d="M 150 220 Q 150 400 400 400 Q 645 400 645 310" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" />
  <polygon points="640,315 645,305 650,315" fill="#000000" />
  <text x="400" y="420" font-family="Arial" font-size="13" text-anchor="middle">Client polls/waits for semaphore to confirm files are ready for processing</text>
  
  <!-- Process Flow Legend (Single-column layout exactly as requested) -->
  <rect x="35" y="440" width="730" height="120" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <text x="340" y="465" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Process Flow:</text>
  
  <!-- Process Flow Header and Steps in single column format -->
  <text x="170" y="485" font-family="Arial" font-size="13">1. External host connects via SSH (Port 22) from allowed IP ranges</text>
  <text x="170" y="500" font-family="Arial" font-size="13">2. Files are transferred to landing zone storage</text>
  <text x="170" y="515" font-family="Arial" font-size="13">3. When files are present, semaphore flag is created</text>
  <text x="170" y="530" font-family="Arial" font-size="13">4. External host polls/waits for semaphore before processing</text>
</svg>
